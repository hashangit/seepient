name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19'

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  # spec 019 (FR-009/T031): build the native commit helper on the platform
  # matrix, generate the checksummed manifest (CI is the ONLY manifest
  # generator), and stage the artifacts for the tarball.
  native-helper:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, platform: darwin-arm64 }
          - { os: macos-14, target: x86_64-apple-darwin, platform: darwin-x64 }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, platform: linux-x64 }
          - { os: ubuntu-24.04, target: aarch64-unknown-linux-gnu, platform: linux-arm64, cross: 'aarch64-linux-gnu-gcc' }

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross linker (linux-arm64)
        if: matrix.cross != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=${{ matrix.cross }}" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --manifest-path native/fs-commit/Cargo.toml --release --target ${{ matrix.target }}

      - name: Stage release artifact
        run: |
          mkdir -p "staging/dist/native-fs-commit/${{ matrix.platform }}"
          cp "native/fs-commit/target/${{ matrix.target }}/release/seepient-fs-commit" \
             "staging/dist/native-fs-commit/${{ matrix.platform }}/seepient-fs-commit"
          chmod +x "staging/dist/native-fs-commit/${{ matrix.platform }}/seepient-fs-commit"

      - uses: actions/upload-artifact@v4
        with:
          name: native-fs-commit-${{ matrix.platform }}
          path: staging/dist/native-fs-commit/${{ matrix.platform }}/seepient-fs-commit
          if-no-files-found: error

  publish-npm:
    needs: [test, native-helper]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Download native helper binaries
        uses: actions/download-artifact@v4
        with:
          path: downloaded-helpers
          pattern: native-fs-commit-*
          merge-multiple: false

      - name: Stage helpers and generate manifest.json
        run: |
          set -e
          mkdir -p dist/native-fs-commit
          # download-artifact with merge-multiple:false nests per-artifact dirs
          for d in downloaded-helpers/native-fs-commit-*; do
            platform="${d#downloaded-helpers/native-fs-commit-}"
            mkdir -p "dist/native-fs-commit/${platform}"
            cp "$d/seepient-fs-commit" "dist/native-fs-commit/${platform}/seepient-fs-commit"
            chmod +x "dist/native-fs-commit/${platform}/seepient-fs-commit"
          done
          node -e '
          const fs = require("fs");
          const path = require("path");
          const crypto = require("crypto");
          const root = "dist/native-fs-commit";
          const platforms = ["darwin-arm64", "darwin-x64", "linux-x64", "linux-arm64"];
          const binaries = {};
          for (const platform of platforms) {
            const p = path.join(root, platform, "seepient-fs-commit");
            const bytes = fs.readFileSync(p);
            if (bytes.length === 0) throw new Error("empty binary: " + p);
            binaries[platform] = {
              path: platform + "/seepient-fs-commit",
              sha256: crypto.createHash("sha256").update(bytes).digest("hex"),
              bytes: bytes.length,
            };
          }
          const manifest = { version: 1, generatedAt: new Date().toISOString(), binaries };
          fs.writeFileSync(path.join(root, "manifest.json"), JSON.stringify(manifest, null, 2) + "\n");
          console.log("manifest:", JSON.stringify(manifest.binaries, null, 2));
          '

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "seepient@${VERSION}" version >/dev/null 2>&1; then
            echo "seepient@${VERSION} is already published on npm — skipping publish"
          else
            npm publish --access public
          fi

  publish-homebrew:
    needs: publish-npm
    runs-on: ubuntu-latest

    steps:
      - name: Resolve version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Fetch npm tarball and compute SHA256
        id: sha
        run: |
          curl -fsSL "https://registry.npmjs.org/seepient/-/seepient-${{ steps.ver.outputs.version }}.tgz" -o pkg.tgz
          echo "sha256=$(sha256sum pkg.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Bump tap formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/hashangit/homebrew-seepient.git tap
          cd tap
          F="Formula/seepient.rb"
          sed -i "s|^  url .*|  url \"https://registry.npmjs.org/seepient/-/seepient-${{ steps.ver.outputs.version }}.tgz\"|" "$F"
          sed -i "s|^  sha256 .*|  sha256 \"${{ steps.sha.outputs.sha256 }}\"|" "$F"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$F"
          git commit -m "seepient ${{ steps.ver.outputs.version }}" || echo "no changes"
          git push

  github-release:
    needs: publish-npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check for committed release notes
        id: notes
        run: |
          VER="${{ steps.ver.outputs.version }}"
          NOTES_FILE="RELEASE_NOTES-v${VER}.md"

          if [[ -f "$NOTES_FILE" ]]; then
            echo "path=$NOTES_FILE" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -f "RELEASE_NOTES-${VER}.md" ]]; then
            echo "path=RELEASE_NOTES-${VER}.md" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract from CHANGELOG.md
          if [[ -f "CHANGELOG.md" ]]; then
            node -e '
              const fs = require("fs");
              const ver = process.argv[1];
              const content = fs.readFileSync("CHANGELOG.md", "utf8");
              const regex = new RegExp("## \\[(?:v)?" + ver.replace(/\./g, "\\.") + "\\][^\\n]*\\n([\\s\\S]*?)(?=\\n## \\[|$)");
              const match = content.match(regex);
              if (match && match[1].trim()) {
                fs.writeFileSync(".extracted_release_notes.md", match[1].trim() + "\n");
                process.exit(0);
              }
              process.exit(1);
            ' "$VER" || true

            if [[ -f ".extracted_release_notes.md" ]]; then
              echo "path=.extracted_release_notes.md" >> "$GITHUB_OUTPUT"
              echo "found=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "found=false" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
