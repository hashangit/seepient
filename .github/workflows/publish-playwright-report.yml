# Playwright report publication (029 D6): runs the e2e suite, then publishes
# the report/dashboard from trusted default-branch code while every untrusted
# artifact input stays outside the checkout — the artifact zip is fetched with
# `gh api` into $RUNNER_TEMP and extracted by
# scripts/extract-playwright-artifacts.py, which refuses unsafe entries before
# writing anything.
name: Playwright report

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Run Playwright e2e
        run: pnpm --filter web exec playwright test
      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  publish:
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      PLAYWRIGHT_REPORT_DIR: ${{ runner.temp }}/playwright-artifacts/playwright-report
      PLAYWRIGHT_TEST_RESULTS_DIR: ${{ runner.temp }}/playwright-artifacts/apps/web/test-results
    steps:
      # Publication runs from the default branch: the artifact (and therefore
      # everything it could override) never becomes executable input here.
      - name: Check out trusted publication code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve the e2e artifact id
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name == "playwright-artifacts") | .id' | head -n1)"
          if [ -z "$id" ]; then
            echo "::warning::No playwright-artifacts artifact found; skipping publication."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "id=$id" >> "$GITHUB_OUTPUT"
          fi
      # Untrusted inputs are fetched and extracted OUTSIDE the trusted
      # checkout; the extractor refuses path traversal, absolute paths, and
      # links before extracting any data.
      - name: Fetch and extract the artifact outside the checkout
        if: steps.artifact.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.id }}
        run: |
          rm -rf "$RUNNER_TEMP/playwright-artifacts" "$RUNNER_TEMP/playwright-artifacts.zip"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "$RUNNER_TEMP/playwright-artifacts.zip"
          python3 scripts/extract-playwright-artifacts.py \
            "$RUNNER_TEMP/playwright-artifacts.zip" "$RUNNER_TEMP/playwright-artifacts"
      - name: Publish the report, gallery, and dashboard
        if: steps.artifact.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.PLAYWRIGHT_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PLAYWRIGHT_S3_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.PLAYWRIGHT_S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.PLAYWRIGHT_S3_ENDPOINT }}
          PLAYWRIGHT_PUBLIC_BASE_URL: ${{ secrets.PLAYWRIGHT_PUBLIC_BASE_URL }}
          PLAYWRIGHT_RESULT: ${{ needs.e2e.result == 'success' && 'success' || 'failure' }}
          PLAYWRIGHT_RUN_ATTEMPT: ${{ github.run_attempt }}
          PLAYWRIGHT_RUN_ID: ${{ github.run_id }}
          PLAYWRIGHT_RUN_NUMBER: ${{ github.run_number }}
          PLAYWRIGHT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLAYWRIGHT_SHA: ${{ github.sha }}
          PLAYWRIGHT_EVENT: ${{ github.event_name }}
          PLAYWRIGHT_BRANCH: ${{ github.head_ref || github.ref_name }}
          PLAYWRIGHT_PR_NUMBER: ${{ github.event.pull_request.number }}
          PLAYWRIGHT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          PLAYWRIGHT_PUBLISH_REPORT: ${{ github.event_name == 'push' }}
        run: bash scripts/publish-playwright-report.sh
