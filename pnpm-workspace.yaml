packages:
  - docs
  - packages/*

overrides:
  '@hono/node-server': 2.0.12
  # GHSA-6qxp-vccf-f47h + source-map-js event-loop DoS (upstream advisories
  # published 2026-10-06/07, after the v0.8.2 audit): force the patched
  # versions across the tree — the MCP SDK also rides pi-ai's nested
  # @google/genai, which the root pin cannot reach.
  '@modelcontextprotocol/sdk': '>=1.31.0 <2'
  source-map-js: '>=1.2.2' 
  body-parser: 2.3.0
  esbuild: 0.28.1
  fast-uri: ^3.1.7
  hono: ^4.12.34
  js-yaml: 4.3.2
  postcss: 8.5.25
  qs: ^6.16.0
  undici: 7.29.1
  vite: 8.2.0
allowBuilds:
  '@google/genai': true
  esbuild: true
  playwright: true
  protobufjs: true

audit:
  ignore:
    # node-forge <=1.4.0 via @anthropic-ai/sandbox-runtime (mitm CA generation).
    # No patched node-forge release exists; sandbox-runtime 0.0.78 still requires ^1.4.0.
    # Remove this entry when the advisory ships a fix.
    - GHSA-86w9-cpqp-85rv
