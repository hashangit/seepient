packages:
  - docs
  - packages/*
  # Spec 029 (M02 T017): adopted Rakazo product, renamed to Seepients at import.
  # Flat globs per the ratified layout — the product core lands at packages/app-core.
  - apps/*
  - infra/sandboxes/supervisor
  - infra/updater

allowBuilds:
  '@google/genai': true
  esbuild: true
  playwright: true
  protobufjs: true
  # Spec 029 T021 — deliberate grants for the imported app tree (upstream's unset
  # placeholders were NEVER copied; each grant is decided, not defaulted):
  # prisma/@prisma/engines: packages/db query engine + `prisma generate`.
  '@prisma/engines': true
  prisma: true
  # koffi: packages/adapters native FFI binding.
  koffi: true
  # Denied by decision (upstream listed them as placeholders):
  # electron-winstaller — desktop PACKAGING excluded from the initial release
  #   (layout-decision §2); source retained, installer not built.
  # cpu-features — optional CPU-capability probe; safe fallback without it.
  # core-js / protobufjs postinstall — banner/no-build; nothing to grant.
  # Explicit DENIES (pnpm 12 requires a decision; omission errors the install):
  # core-js — postinstall is a funding banner; no build product needed.
  core-js: false
  # cpu-features — optional CPU probe; consumers fall back to runtime detection.
  cpu-features: false
  # electron-winstaller — desktop packaging excluded from the initial release.
  electron-winstaller: false
  # ssh2 — TRANSITIVE only (no adopted package depends on it directly); its
  # node-gyp binding is optional — ssh2 falls back to its pure-JS crypto path.
  ssh2: false

patchedDependencies:
  # Upstream patch carried verbatim (T021); affects desktop packaging only.
  app-builder-lib@26.15.3: patches/app-builder-lib@26.15.3.patch

overrides:
  '@hono/node-server': 2.0.12
  # GHSA-6qxp-vccf-f47h + source-map-js event-loop DoS (upstream advisories
  # published 2026-10-06/07, after the v0.8.2 audit): force the patched
  # versions across the tree — the MCP SDK also rides pi-ai's nested
  # @google/genai, which the root pin cannot reach.
  '@modelcontextprotocol/sdk': '>=1.31.0 <2'
  source-map-js: '>=1.2.2'
  body-parser: 2.3.0
  fast-uri: ^3.1.7
  esbuild: 0.25.10
  # (0.28 broke vitepress 1.6.4's client transpile — "Transforming
  # destructuring to the configured target environment is not supported yet";
  # 0.25.10 is the GHSA-67mh-4ck4 floor and transpiles clean.)
  js-yaml: 4.3.2
  postcss: 8.5.25
  qs: ^6.16.0
  undici: 7.29.1
  # vite security pin SCOPED to the engine packages (spec 029 T021): the only
  # vite consumer in the app tree is @seepients/web at its own exact 8.3.0
  # (upstream-identical); the unscoped pin was downgrading it and dragging
  # @types/node@25 into the app graph — the drift behind the first check run's
  # type errors.
  'seepient>vite': 8.2.0
  'seepient-engine>vite': 8.2.0
  # Spec 029 T021 — merged from upstream (pnpm.overrides, E2):
  # proxy-addr: security floor, harmless engine-side.
  # Spec 029 T021 (dedupe-gate compliance): the imported upstream runtime
  # pins pi-ai 0.87.1 (openai@6) while the engine rides pi-ai 1.3.0 — one
  # openai major only, per the 027 seam (d) gate. The 0.87 vendor layer is
  # DORMANT under AGENT_RUNTIME=seepient and is removed at S18; recorded as
  # migration-exceptions entry ME-001.
  openai: 7.19.0
  '@anthropic-ai/sdk': 0.129.0
  '@google/genai': 2.21.0
  'proxy-addr@<2.0.8': 2.0.8
  # e2b's nested undici-8 child ONLY (scoped selector) — the engine's global
  # undici 7.29.1 pin above is untouched by this entry.
  'e2b>undici8': 'npm:undici@8.10.2'
  # DROPPED by decision: upstream's react/react-dom 19.2.3 overrides would
  # downgrade the engine's ^19.2.7. Imported packages carry exact 19.2.3 pins
  # and the engine rides ^19.2.7 — two coexisting react graphs, each internally
  # consistent; unification is a deliberate later bump, not import churn.
  # Type-package alignment to the UPSTREAM-resolved pair (fresh resolution
  # otherwise floats @types/react to 19.3.0 against packages pinned to react
  # 19.2.3 — the ui-web ref-types failure). Engine pins are untouched by the
  # scoped selectors.
  # (Superseded scoped attempt: pnpm override selectors do not glob package
  # names — replaced by the exact-range pins below.)
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.7
  # dockerode's transitive graph floats @types/node@>=25 (absent upstream —
  # the supervisor compiled against 24.13.4 there); pin just that range.
  '@types/node@>=25': 24.13.4
  # Spec 029 T004 (imported app tree, first CI audit of the product deps):
  # transitive floors for the 2026-10-21 advisory batch. shell-quote rides the
  # expo/react-devtools-core chain, deepmerge-ts the prisma config chain,
  # mysql2 the better-auth prisma-adapter chain (the app runs postgres — the
  # mysql2 code path is dormant, the advisory is fixed upstream regardless).
  shell-quote: '>=1.11.0'
  deepmerge-ts: '>=8.0.0'
  mysql2: '>=3.22.0'
  # hono serveStatic double-decode middleware bypass (GHSA for <4.13.11) —
  # raises the existing security-floor pin; the engine's API stays on hono 4.x.
  hono: '>=4.13.11'
  # expo chains (apps/mobile, dormant for the MVP — web/api/worker only):
  # uuid v3/v5/v6 buffer bounds (xcode/config-plugins chain), percent-decoding
  # DoS in decode-uri-component (expo-router chain).
  uuid: '>=11.1.1'
  decode-uri-component: '>=0.5.0'
  # apps/www astro site: sharp librsvg CVE + the vite 8.3.0–8.3.2 batch,
  # both riding astro's transitive graph (astro pins unchanged).
  # (3-level selectors don't parse in pnpm 12 — 2-level only; astro/vitefu
  # exist solely under apps/www, so the scope holds.)
  'astro>sharp': '>=0.35.5'
  'vitefu>vite': '>=8.3.3'
  '@astrojs/react>vite': '>=8.3.3'
  # GHSA-rxp7-6hxx-x8q5 (ip-address SSRF-filter bypass, fixed 10.7.4): rides
  # express-rate-limit under the MCP SDK inside pi-ai's nested @google/genai —
  # the nested chain the root pin cannot reach (same shape as the
  # @modelcontextprotocol/sdk override above).
  ip-address: '>=10.7.4'

audit:
  ignore:
    # node-forge <=1.4.0 via @anthropic-ai/sandbox-runtime (mitm CA generation).
    # No patched node-forge release exists; sandbox-runtime 0.0.78 still requires ^1.4.0.
    # Remove this entry when the advisory ships a fix.
    - GHSA-86w9-cpqp-85rv
    # braces <=3.0.3 via the imported app tree (expo/metro → micromatch chain).
    # No patched release exists (advisory 2026-10); pattern globs from product
    # config are not attacker-controlled input on any exercised path.
    # Remove this entry when the advisory ships a fix.
    - GHSA-vfj7-8cjw-p6xm
