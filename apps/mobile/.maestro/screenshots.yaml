appId: com.seepients.app
name: Seepients mobile screenshots
tags:
  - screenshots
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny

# A cold API 34 emulator can show a launcher ANR over the healthy app.
- extendedWaitUntil:
    visible: "Sign up for Seepients|Pixel Launcher isn't responding"
    timeout: 30000
- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn: "Close app"
- extendedWaitUntil:
    visible: "Sign up for Seepients"
    timeout: 30000
- takeScreenshot: "02-sign-up"
- tapOn: "Sign in"
- assertVisible: "Sign in to Seepients"
- takeScreenshot: "01-sign-in"

- tapOn: "Use a custom server"
- assertVisible: "Server"
- takeScreenshot: "03-server"
- tapOn: "Cancel"

- tapOn: "Email"
- inputText: ${SEEPIENTS_SCREENSHOT_EMAIL}
- tapOn: "Password"
- inputText: ${SEEPIENTS_SCREENSHOT_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- tapOn:
    text: "Don’t allow"
    optional: true

- extendedWaitUntil:
    visible: "Researcher"
    timeout: 30000
- takeScreenshot: "04-inbox"

- tapOn: "Activity"
- extendedWaitUntil:
    visible: "Recent"
    timeout: 10000
- takeScreenshot: "05-activity"

- tapOn: "Search"
- inputText: "fixture"
- hideKeyboard
- extendedWaitUntil:
    visible: "Weekly fixture review"
    timeout: 10000
- takeScreenshot: "06-search-results"

- openLink: "seepients:///new"
- assertVisible: "Name this bot"
- takeScreenshot: "07-new-bot"

- openLink: "seepients:///new-group"
- assertVisible: "Name this group"
- takeScreenshot: "08-new-group"

- openLink: "seepients:///new-space"
- assertVisible: "Customer support"
- takeScreenshot: "09-new-space"

- openLink: "seepients:///account"
- extendedWaitUntil:
    visible: "Change password"
    timeout: 10000
- takeScreenshot: "10-account"
- tapOn: "Change password"
- assertVisible: "Current password"
- takeScreenshot: "10b-change-password"
- back

- openLink: "seepients:///models"
- extendedWaitUntil:
    visible: "Active model"
    timeout: 10000
- scrollUntilVisible:
    element: "Show more"
    direction: DOWN
- takeScreenshot: "11-models"
- tapOn: "Show more"
- scrollUntilVisible:
    element: "Show less"
    direction: DOWN
- takeScreenshot: "11b-all-providers"

- openLink: "seepients:///voice"
- extendedWaitUntil:
    visible: "Scripted"
    timeout: 10000
- takeScreenshot: "12-voice"

- openLink: "seepients:///integrations"
- extendedWaitUntil:
    visible: "Search apps"
    timeout: 10000
- takeScreenshot: "13-integrations"
- tapOn:
    id: "integrations-advanced"
- assertVisible: "Add MCP server"
- takeScreenshot: "14-integrations-advanced"

- openLink: "seepients:///thread?botId=${SEEPIENTS_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: "The fixture workspace is ready."
    timeout: 10000
- assertNotVisible: "Reply"
- assertNotVisible: "React"
- assertNotVisible: "More"
- takeScreenshot: "15-thread"
- tapOn: "Message Researcher"
- inputText: "Keyboard visibility check"
- assertVisible: "Keyboard visibility check"
- assertVisible: "Send"
- takeScreenshot: "15d-thread-keyboard"
- eraseText
- hideKeyboard
- longPressOn: "The fixture workspace is ready."
- assertVisible: "Reply"
- assertVisible: "React"
- assertVisible: "More"
- takeScreenshot: "15b-message-actions"
- tapOn: "More"
- assertVisible: "Speak message"
- back
# User messages omit Speak, so Android fits Reply/React/Copy on one page (no More).
- longPressOn: "Summarize the fixture launch checklist."
- assertVisible: "Reply"
- assertVisible: "React"
- assertVisible: "Copy"
- assertNotVisible: "More"
- assertNotVisible: "Speak message"
- tapOn: "Reply"
- assertVisible: "Replying to"
- tapOn: "Cancel reply"
- tapOn: "Bot actions"
- assertVisible: "Clear conversation"
- takeScreenshot: "16-bot-actions"
- back

- openLink: "seepients:///bot-settings?botId=${SEEPIENTS_SCREENSHOT_BOT_ID}"
- extendedWaitUntil:
    visible: "Researcher"
    timeout: 10000
- assertVisible: "Advanced"
- tapOn: "Advanced"
- assertVisible: "Model"
# Label includes the resolved space model, e.g. "Space default (OpenAI: …)".
- assertVisible: "Space default.*"
- takeScreenshot: "17-bot-settings"

- openLink: "seepients:///computer?botId=${SEEPIENTS_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: "Take control"
    timeout: 10000
- takeScreenshot: "18-computer"

- openLink: "seepients:///group-thread?groupId=${SEEPIENTS_SCREENSHOT_GROUP_ID}&name=Launch%20team"
- extendedWaitUntil:
    visible: "The fixture launch plan is ready."
    timeout: 10000
- assertNotVisible: "Reply"
- assertNotVisible: "React"
- assertNotVisible: "More"
- takeScreenshot: "19-group-thread"
- tapOn: "Message Launch team"
- inputText: "Group keyboard visibility check"
- assertVisible: "Group keyboard visibility check"
- assertVisible: "Send"
- takeScreenshot: "19b-group-thread-keyboard"
- eraseText
- hideKeyboard
- longPressOn: "The fixture launch plan is ready."
- assertVisible: "Reply"
- assertVisible: "React"
- assertVisible: "More"
- back

- openLink: "seepients:///group-settings?groupId=${SEEPIENTS_SCREENSHOT_GROUP_ID}"
- extendedWaitUntil:
    visible: "Delete group"
    timeout: 10000
- takeScreenshot: "20-group-settings"

- openLink: "seepients:///routine?botId=${SEEPIENTS_SCREENSHOT_BOT_ID}&botName=Researcher&routineId=${SEEPIENTS_SCREENSHOT_ROUTINE_ID}"
- extendedWaitUntil:
    visible: "Weekly fixture review"
    timeout: 10000
- takeScreenshot: "21-routine"

# Verify saved appearance changes on already-mounted screens and modal routes.
- openLink: "seepients:///account"
- extendedWaitUntil:
    visible: "Dark"
    timeout: 10000
- tapOn: "Dark"
- takeScreenshot: "22-account-dark"

- openLink: "seepients:///new"
- assertVisible: "Name this bot"
- takeScreenshot: "23-new-bot-dark"

- openLink: "seepients:///new-group"
- assertVisible: "Name this group"
- takeScreenshot: "24-new-group-dark"

- openLink: "seepients:///new-space"
- assertVisible: "Customer support"
- takeScreenshot: "25-new-space-dark"

- openLink: "seepients:///thread?botId=${SEEPIENTS_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: "The fixture workspace is ready."
    timeout: 10000
- takeScreenshot: "26-thread-dark"

- openLink: "seepients:///group-thread?groupId=${SEEPIENTS_SCREENSHOT_GROUP_ID}&name=Launch%20team"
- extendedWaitUntil:
    visible: "The fixture launch plan is ready."
    timeout: 10000
- takeScreenshot: "27-group-thread-dark"

- openLink: "seepients:///group-settings?groupId=${SEEPIENTS_SCREENSHOT_GROUP_ID}"
- assertVisible: "Delete group"
- takeScreenshot: "28-group-settings-dark"

- openLink: "seepients:///account"
- tapOn: "Light"
- openLink: "seepients:///thread?botId=${SEEPIENTS_SCREENSHOT_BOT_ID}&name=Researcher"
- assertVisible: "The fixture workspace is ready."
- takeScreenshot: "29-thread-light-restored"

# Capture the reaction after theme comparisons. Reactions are append-only, so adding
# 👍 earlier would leak into dark/light thread frames with no remove control.
- longPressOn: "The fixture workspace is ready."
- tapOn: "React"
- tapOn: "👍"
- extendedWaitUntil:
    visible: "👍"
    timeout: 10000
- assertNotVisible: "Reply"
- takeScreenshot: "15c-message-reaction"
