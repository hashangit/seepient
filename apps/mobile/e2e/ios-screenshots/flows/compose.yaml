appId: com.seepients.app
name: Compose
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      SEEPIENTS_ACTIVE_EMAIL: ${SEEPIENTS_SCREENSHOT_EMAIL}
- openLink: "seepients:///new"
- extendedWaitUntil:
    visible: "Name this bot"
    timeout: 15000
- takeScreenshot: 01-new-bot
- tapOn: "Cancel"
- openLink: "seepients:///new-space"
- extendedWaitUntil:
    visible: "Customer support|Create space"
    timeout: 15000
- takeScreenshot: 02-new-space
- tapOn: "Cancel"
- openLink: "seepients:///new-group"
- extendedWaitUntil:
    visible: "Name this group"
    timeout: 15000
- takeScreenshot: 03-new-group
- openLink: "seepients:///"
